name: Release

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Create a new release
    # If the event is a workflow_dispatch or the label 'make release' is set and PR is closed because of a merge
    if: (github.event_name == 'workflow_dispatch') || (contains( github.event.pull_request.labels.*.name, 'make release') && github.event.pull_request.merged == true)
    runs-on: "ubuntu-latest"
    steps:
      - name: Setting the Reference
        id: release
        run: |
          if [[ "${{ github.event_name }}" = "workflow_dispatch" ]]; then
            echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.base_ref }}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.ref }}
      - name: Set git name, mail and origin
        run: |
          git config --global user.name "${{ secrets.GREENBONE_BOT }}"
          git config --global user.email "${{ secrets.GREENBONE_BOT_MAIL }}"
          git remote set-url origin https://${{ secrets.GREENBONE_BOT_TOKEN }}@github.com/${{ github.repository }}
      - uses: greenbone/actions/uv@v3
      - name: Determine release versions
        id: release-version
        run: |
          uv run pontos-release show --release-type calendar --output-format env --versioning-scheme pep440
          uv run pontos-release show --release-type calendar --output-format github-action --versioning-scheme pep440
      - name: Determine changelog
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run git-cliff -v --strip header -o /tmp/changelog.md --unreleased --tag ${{ steps.release-version.outputs.release_version }} ${{ steps.release-version.outputs.last_release_version }}..HEAD
      - name: Create release
        run: |
          uv run pontos-release create --repository ${{ github.repository }} --release-type calendar --changelog /tmp/changelog.md --release-version ${{ steps.release-version.outputs.release_version }}
        env:
          GITHUB_USER: ${{ secrets.GREENBONE_BOT }}
          GITHUB_TOKEN: ${{ secrets.GREENBONE_BOT_TOKEN }}
      - name: Import gpg key from secrets
        run: |
          echo -e "${{ secrets.GPG_KEY }}" >> tmp.file
          gpg --pinentry-mode loopback --passphrase ${{ secrets.GPG_PASSPHRASE }} --import tmp.file
          rm tmp.file
      - name: Sign assets for released version
        run: |
          uv run pontos-release sign --repository ${{ github.repository }} --signing-key ${{ secrets.GPG_FINGERPRINT }} --passphrase ${{ secrets.GPG_PASSPHRASE }} --release-version ${{ steps.release-version.outputs.release_version }}
        env:
          GITHUB_USER: ${{ secrets.GREENBONE_BOT }}
          GITHUB_TOKEN: ${{ secrets.GREENBONE_BOT_TOKEN }}
